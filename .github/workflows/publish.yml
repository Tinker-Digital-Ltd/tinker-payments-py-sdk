name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v0.3.0
      verify_only:
        description: Build and validate without publishing
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.release.tag_name || 'v0.3.0' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'v0.3.0' }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name || 'v0.3.0' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check package and runtime versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'v0.3.0' }}
        run: |
          python - <<'PY'
          import os, runpy, tomllib
          from pathlib import Path
          expected = os.environ['RELEASE_TAG'].removeprefix('v')
          package = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert package['name'] == 'tinker-payments'
          assert package['version'] == expected
          assert runpy.run_path('tinker/__version__.py')['__version__'] == expected
          PY
      - name: Test and build distributions
        run: |
          python -m pip install '.[dev]' build twine
          ruff check .
          python -m unittest discover -s tests -v
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name != 'pull_request' && !inputs.verify_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tinker-payments/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
